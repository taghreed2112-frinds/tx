<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رحلة القرار الذكي | الشروط المتداخلة</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#f1edff,#eaf8ff);font-family:Tahoma,Arial,sans-serif;color:#26234b;min-height:100vh}.wrap{max-width:850px;margin:30px auto;padding:18px}.panel{background:white;border-radius:30px;padding:clamp(22px,5vw,46px);box-shadow:0 20px 65px #7971ad25}header{text-align:center}.eyebrow{color:#7464c5;font-weight:bold}h1{font-size:clamp(27px,5vw,44px);margin:12px 0}h2{font-size:clamp(22px,4vw,30px)}p{line-height:1.9}.art{font-size:75px;text-align:center;margin:18px}.progress{display:flex;gap:8px;margin:25px 0}.progress span{height:7px;flex:1;background:#ece9f7;border-radius:20px}.progress span.on{background:#8b73ea}.scene{text-align:center;min-height:270px}.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px}button{font:inherit;cursor:pointer;border:0;background:#7661d6;color:white;border-radius:18px;padding:16px 24px;font-weight:bold;min-width:155px;box-shadow:0 7px 20px #7661d62b}button.alt{background:#eae5ff;color:#5948aa}button:hover{filter:brightness(.96)}.path{background:#f7f5ff;padding:18px;border-radius:18px;text-align:right;line-height:2.2;margin:15px 0}.result{background:#e8f9f0;border-radius:20px;padding:22px;font-size:24px;font-weight:bold;color:#17764b}.code{background:#182238;color:#e8f4ff;text-align:left;direction:ltr;white-space:pre-wrap;line-height:1.8;padding:20px;border-radius:18px;overflow:auto;font:16px/1.8 Consolas,monospace}.hidden{display:none}.note{font-size:14px;color:#696681}footer{text-align:center;margin-top:20px;color:#777}.arrow{color:#8b73ea}</style><main class="wrap"><div class="panel"><header><div class="eyebrow">المهارات الرقمية • بايثون • الشروط المتداخلة</div><h1>☂️ رحلة القرار الذكي</h1><p>نكتشف كيف نتخذ القرار في حياتنا، ثم نرى كيف يفكر بايثون</p></header><div class="progress" id="progress"></div><section class="scene"><div class="art" id="art">🏡🌤️</div><h2 id="heading">هل تحتاجين إلى مظلة؟</h2><p id="desc">تخيلي أنكِ في المنزل وتفكرين في الخروج. سنكتشف القرار خطوة بخطوة.</p><div id="choices" class="actions"></div><div id="details"></div></section></div><footer>نشاط تعليمي تفاعلي قابل للمشاركة مع المعلمات والطالبات</footer></main><script>let step=0,out=null,rain=null;const $=id=>document.getElementById(id);function btn(t,f,alt=false){let b=document.createElement('button');b.textContent=t;if(alt)b.className='alt';b.onclick=f;$('choices').append(b)}function render(){ $('choices').innerHTML='';$('details').innerHTML='';$('progress').innerHTML=[0,1,2,3].map(i=>'<span class="'+(step>=i?'on':'')+'"></span>').join('');if(step===0){$('art').textContent='🏡🌤️';$('heading').textContent='هل تحتاجين إلى مظلة؟';$('desc').textContent='تخيلي أنكِ في المنزل وتفكرين في الخروج. سنكتشف القرار خطوة بخطوة.';btn('ابدئي الرحلة ←',()=>{step=1;render()})}if(step===1){$('art').textContent='🏠🚶‍♀️';$('heading').textContent='هل سأخرج من المنزل؟';$('desc').textContent='هذا هو الشرط الأول. اختاري قرارك.';btn('نعم، سأخرج',()=>{out=true;step=2;render()});btn('لا، سأبقى',()=>{out=false;step=3;render()},true)}if(step===2){$('art').textContent='🌦️☂️';$('heading').textContent='هل الجو ممطر؟';$('desc').textContent='ظهر السؤال الثاني لأنكِ اخترتِ الخروج من المنزل.';btn('نعم، ممطر',()=>{rain=true;step=3;render()});btn('لا، غير ممطر',()=>{rain=false;step=3;render()},true)}if(step===3){let result=!out?'أبقى في المنزل 🏡':rain?'آخذ المظلة ☂️':'لا أحتاج إلى مظلة ☀️';$('art').textContent=!out?'🏡':rain?'☔':'☀️';$('heading').textContent='وصلنا إلى النتيجة!';$('desc').textContent='شاهدي المسار الذي اتبعته قراراتك.';$('details').innerHTML='<div class="path">① هل سأخرج؟ <b>'+(out?'نعم':'لا')+'</b><br>'+(out?'② هل الجو ممطر؟ <b>'+(rain?'نعم':'لا')+'</b><br>':'② لم نختبر المطر لأن الشرط الأول لم يتحقق.<br>')+'</div><div class="result">'+result+'</div>';btn('أريني كود بايثون',()=>{step=4;render()});btn('جربي مسارًا آخر',reset,true)}if(step===4){$('art').textContent='🐍💻';$('heading').textContent='كيف يكتب بايثون القرار؟';$('desc').textContent='لاحظي أن الشرط الثاني مكتوب داخل الشرط الأول بمسافة بادئة.';let c='go_out = '+(out?'True':'False')+'\nrain = '+(rain?'True':'False')+'\n\nif go_out:\n    if rain:\n        print("آخذ المظلة")\n    else:\n        print("لا أحتاج إلى مظلة")\nelse:\n    print("أبقى في المنزل")';$('details').innerHTML='<pre class="code"></pre><div class="path">💡 '+(!out?'عندما كان go_out يساوي False، تجاوز بايثون سؤال المطر تمامًا.':'عندما كان go_out يساوي True، انتقل بايثون لفحص rain.')+'</div>';$('details').querySelector('pre').textContent=c;btn('إعادة الرحلة',reset)}}function reset(){step=0;out=null;rain=null;render()}render();</script></html>
